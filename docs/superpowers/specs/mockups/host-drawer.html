<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>主机管理抽屉 Mockup</title>
<link rel="stylesheet" href="https://unpkg.com/element-ui@2.15.14/lib/theme-chalk/index.css">
<style>
  body { margin: 0; font-family: -apple-system, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f0f2f5; min-height: 100vh; }
  .app-header { background: #fff; height: 56px; box-shadow: 0 1px 4px rgba(0,21,41,.08); display: flex; align-items: center; padding: 0 24px; }
  .app-header h1 { font-size: 18px; margin: 0; color: #303133; }
  .breadcrumb { color: #909399; font-size: 13px; margin-left: 16px; }

  /* 抽屉 */
  .drawer-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.3); z-index: 2000; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 480px; background: #fff; box-shadow: -2px 0 8px rgba(0,0,0,.1); z-index: 2001; display: flex; flex-direction: column; }
  .drawer-header { height: 56px; padding: 0 20px; display: flex; align-items: center; border-bottom: 1px solid #e4e7ed; }
  .drawer-header h2 { font-size: 16px; margin: 0; color: #303133; font-weight: 600; }
  .drawer-close { margin-left: auto; cursor: pointer; color: #909399; font-size: 18px; padding: 8px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
  .search-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .search-row .el-input { flex: 1; }
  .toolbar { display: flex; gap: 8px; margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px solid #ebeef5; }
  .host-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .host-table th { text-align: left; padding: 8px 4px; color: #909399; font-weight: 500; border-bottom: 1px solid #ebeef5; }
  .host-table td { padding: 12px 4px; border-bottom: 1px solid #f5f7fa; }
  .host-table tr:hover { background: #f5f7fa; }
  .host-actions { display: flex; gap: 4px; }
  .host-actions .el-button { padding: 4px 8px; }

  /* 表单弹层 */
  .form-mask { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.5); z-index: 3000; display: flex; align-items: center; justify-content: center; }
  .form-dialog { background: #fff; border-radius: 4px; width: 520px; max-height: 90vh; display: flex; flex-direction: column; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
  .form-header { padding: 16px 20px; border-bottom: 1px solid #e4e7ed; display: flex; align-items: center; }
  .form-header h3 { margin: 0; font-size: 16px; color: #303133; }
  .form-body { padding: 20px; overflow-y: auto; }
  .form-section { margin-bottom: 16px; }
  .form-section h4 { margin: 0 0 12px 0; font-size: 13px; color: #606266; font-weight: 500; padding-bottom: 6px; border-bottom: 1px solid #ebeef5; }
  .form-row { display: flex; gap: 12px; margin-bottom: 12px; }
  .form-item { flex: 1; }
  .form-item label { display: block; font-size: 13px; color: #606266; margin-bottom: 4px; }
  .form-item label .required { color: #f56c6c; }
  .form-item .el-input, .form-item .el-select, .form-item .el-textarea { width: 100%; }
  .form-item textarea { min-height: 70px; resize: vertical; }
  .radio-group { display: flex; gap: 16px; }
  .radio-group label { display: flex; align-items: center; gap: 4px; font-size: 14px; color: #303133; cursor: pointer; }
  .credential-block { background: #fafbfc; border: 1px solid #ebeef5; border-radius: 4px; padding: 12px; margin-top: 8px; }
  .form-footer { padding: 12px 20px; border-top: 1px solid #e4e7ed; display: flex; gap: 8px; justify-content: flex-end; }
  .form-footer .el-button--primary { margin-left: 4px; }
</style>
</head>
<body>
  <div class="app-header">
    <h1>📋 RuoYi 后台管理</h1>
    <span class="breadcrumb">/ 工具 / AI 助手</span>
  </div>

  <!-- 抽屉遮罩 -->
  <div class="drawer-mask"></div>

  <!-- 抽屉 -->
  <div class="drawer">
    <div class="drawer-header">
      <h2>📦 主机管理</h2>
      <span class="drawer-close">×</span>
    </div>
    <div class="drawer-body">
      <div class="search-row">
        <div class="el-input el-input--small">
          <input class="el-input__inner" placeholder="主机名" style="height: 32px; line-height: 32px;">
        </div>
        <div class="el-input el-input--small">
          <input class="el-input__inner" placeholder="IP" style="height: 32px; line-height: 32px;">
        </div>
        <div class="el-select" style="width: 100px;">
          <div class="el-input el-input--small">
            <input class="el-input__inner" value="状态：全部" readonly style="height: 32px; line-height: 32px;">
          </div>
        </div>
        <button class="el-button el-button--primary el-button--small">查询</button>
        <button class="el-button el-button--small">重置</button>
      </div>

      <div class="toolbar">
        <button class="el-button el-button--primary el-button--small">+ 新增</button>
        <button class="el-button el-button--small">🔄 刷新</button>
        <button class="el-button el-button--danger el-button--small" disabled style="opacity: 0.5;">批量删除</button>
      </div>

      <table class="host-table">
        <thead>
          <tr>
            <th><label class="el-checkbox"><span class="el-checkbox__inner"></span></label></th>
            <th>主机名 / IP</th>
            <th>协议</th>
            <th>认证</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><label class="el-checkbox"><span class="el-checkbox__inner"></span></label></td>
            <td>
              <div style="font-weight: 500;">prod-web-01</div>
              <div style="color: #909399; font-size: 12px;">10.0.1.11:22</div>
            </td>
            <td>SSH2</td>
            <td><span class="el-tag el-tag--mini">口令</span></td>
            <td><span style="color: #67c23a;">● 在线</span></td>
            <td>
              <div class="host-actions">
                <button class="el-button el-button--text el-button--mini">编辑</button>
                <button class="el-button el-button--text el-button--mini">测试</button>
                <button class="el-button el-button--text el-button--mini" style="color: #f56c6c;">删除</button>
              </div>
            </td>
          </tr>
          <tr>
            <td><label class="el-checkbox"><span class="el-checkbox__inner"></span></label></td>
            <td>
              <div style="font-weight: 500;">prod-web-02</div>
              <div style="color: #909399; font-size: 12px;">10.0.1.12:22</div>
            </td>
            <td>SSH2</td>
            <td><span class="el-tag el-tag--mini el-tag--warning">私钥</span></td>
            <td><span style="color: #67c23a;">● 在线</span></td>
            <td>
              <div class="host-actions">
                <button class="el-button el-button--text el-button--mini">编辑</button>
                <button class="el-button el-button--text el-button--mini">测试</button>
                <button class="el-button el-button--text el-button--mini" style="color: #f56c6c;">删除</button>
              </div>
            </td>
          </tr>
          <tr>
            <td><label class="el-checkbox"><span class="el-checkbox__inner"></span></label></td>
            <td>
              <div style="font-weight: 500;">prod-db-01</div>
              <div style="color: #909399; font-size: 12px;">10.0.2.21:22</div>
            </td>
            <td>SSH2</td>
            <td><span class="el-tag el-tag--mini">口令</span></td>
            <td><span style="color: #909399;">● 未知</span></td>
            <td>
              <div class="host-actions">
                <button class="el-button el-button--text el-button--mini">编辑</button>
                <button class="el-button el-button--text el-button--mini">测试</button>
                <button class="el-button el-button--text el-button--mini" style="color: #f56c6c;">删除</button>
              </div>
            </td>
          </tr>
          <tr>
            <td><label class="el-checkbox"><span class="el-checkbox__inner"></span></label></td>
            <td>
              <div style="font-weight: 500;">staging-app-01</div>
              <div style="color: #909399; font-size: 12px;">10.0.3.31:22</div>
            </td>
            <td>SSH2</td>
            <td><span class="el-tag el-tag--mini el-tag--warning">私钥</span></td>
            <td><span style="color: #e6a23c;">● 离线</span></td>
            <td>
              <div class="host-actions">
                <button class="el-button el-button--text el-button--mini">编辑</button>
                <button class="el-button el-button--text el-button--mini">测试</button>
                <button class="el-button el-button--text el-button--mini" style="color: #f56c6c;">删除</button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 新增主机表单弹层 -->
  <div class="form-mask">
    <div class="form-dialog">
      <div class="form-header">
        <h3>+ 新增主机</h3>
      </div>
      <div class="form-body">
        <div class="form-section">
          <h4>基本信息</h4>
          <div class="form-row">
            <div class="form-item">
              <label>主机名 <span class="required">*</span></label>
              <div class="el-input"><input class="el-input__inner" placeholder="1~64 字符"></div>
            </div>
            <div class="form-item">
              <label>IP 地址 <span class="required">*</span></label>
              <div class="el-input"><input class="el-input__inner" placeholder="IPv4 或 IPv6"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <label>SSH 端口 <span class="required">*</span></label>
              <div class="el-input"><input class="el-input__inner" value="22"></div>
            </div>
            <div class="form-item">
              <label>用户名 <span class="required">*</span></label>
              <div class="el-input"><input class="el-input__inner" placeholder="root / appuser"></div>
            </div>
          </div>
          <div class="form-row">
            <div class="form-item">
              <label>所属部门 <span class="required">*</span></label>
              <div class="el-input"><input class="el-input__inner" value="运维部" readonly></div>
            </div>
            <div class="form-item">
              <label>备注</label>
              <div class="el-input"><input class="el-input__inner" placeholder="≤ 500 字符"></div>
            </div>
          </div>
        </div>

        <div class="form-section">
          <h4>认证方式</h4>
          <div class="radio-group">
            <label><input type="radio" name="auth" checked> 口令</label>
            <label><input type="radio" name="auth"> 私钥</label>
          </div>
          <div class="credential-block">
            <div class="form-item">
              <label>口令 <span class="required">*</span></label>
              <div class="el-input"><input class="el-input__inner" type="password" placeholder="1~128 字符（密文落库）"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="form-footer">
        <button class="el-button">取消</button>
        <button class="el-button">🔌 测试连接</button>
        <button class="el-button el-button--primary">保存</button>
      </div>
    </div>
  </div>
</body>
</html>
